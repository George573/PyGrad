[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygrad"
version = "0.1.0"
description = "A lightweight automatic differentiation library with NumPy and CuPy backends."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "George573" },
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["pygrad*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
